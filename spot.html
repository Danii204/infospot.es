<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06677f">
<link rel="icon" href="/img/logo.svg?v=2" type="image/svg+xml">
<title>InfoSpot spot</title>
<style>
  :root { --bg: #f5fafd; --card: #ffffff; --text: #171c1f; --muted: #40484c; --primary: #06677f; --on-primary: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1416; --card: #1b2023; --text: #dee3e6; --muted: #bfc8cc; --primary: #88d1eb; --on-primary: #003543; } }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 4px 0 16px; }
  a.button { display: block; text-align: center; padding: 14px; border-radius: 999px; text-decoration: none; font-weight: 600; margin-top: 10px; }
  .primary { background: var(--primary); color: var(--on-primary); }
  .secondary { border: 1px solid var(--muted); color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="name">InfoSpot</h1>
    <p id="what"></p>
    <a class="button primary" id="open" href="#">Open in InfoSpot</a>
    <a class="button secondary" id="download" href="https://infospot.es/app/">Open InfoSpot on the web</a>
    <a class="button secondary" id="map" href="#">See it on a map</a>
  </div>
  <p id="note">InfoSpot is a fishing app for Android and the web. This page only reads the link.</p>
</main>
<script>
  // Static page: it only reads the spot from its own link; nothing is sent anywhere.
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get("lat")), lon = parseFloat(q.get("lon"));
  var es = (navigator.language || "").toLowerCase().indexOf("es") === 0;
  var types = es
    ? { spot: "Pesquero", "catch": "Captura", bite: "Picada", structure: "Estructura", danger: "Peligro", access: "Acceso", other: "Otro" }
    : { spot: "Spot", "catch": "Catch", bite: "Bite", structure: "Structure", danger: "Danger", access: "Access", other: "Other" };
  document.getElementById("name").textContent = q.get("n") || "InfoSpot";
  var parts = [types[q.get("t")] || types.other];
  if (q.get("w")) parts.push(q.get("w") + " kg");
  if (!isNaN(lat) && !isNaN(lon)) parts.push(lat.toFixed(5) + ", " + lon.toFixed(5));
  document.getElementById("what").textContent = parts.join(" · ");
  var latest = "https://infospot.es/";
  document.getElementById("open").href = "intent://spot?" + q.toString() +
    "#Intent;scheme=infospot;S.browser_fallback_url=" + encodeURIComponent(latest) + ";end";
  document.getElementById("map").href = "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lon + "#map=15/" + lat + "/" + lon;
  if (es) {
    document.documentElement.lang = "es";
    document.getElementById("open").textContent = "Abrir en InfoSpot";
    document.getElementById("download").textContent = "Abrir InfoSpot en la web";
    document.getElementById("map").textContent = "Verlo en un mapa";
    document.getElementById("note").textContent = "InfoSpot es una app de pesca para Android y la web. Esta página solo lee el enlace.";
  }
</script>
</body>
</html>
